# 저장소의 .github/workflows/fetch-kbo.yml 위치에 넣어주세요.
#
# 매일 새벽(한국 시간 00:10)에 네이버 스포츠에서 KBO 정규시즌 + 포스트시즌 결과·일정을 받아 data 폴더에 시즌별로 보관해요.
#   data/kbo_results_2013.csv ... (연도별 파일. 지난 시즌은 한 번만 받고 그대로 둬요)
#   data/kbo_results.csv          (올해 파일의 복사본 - '자동 수집된 최신 CSV 불러오기'용)
#   data/index.json               (보관된 시즌 목록 - 기록판이 과거 시즌을 자동으로 불러올 때 사용)
#
# ★ FOUNDING_DATE(창단일)만 적어두면, 그 해부터 올해까지 모든 시즌을 알아서 저장해요.
#   - 최신 시즌부터 받고, 지난 시즌은 한 번만 받아요. 이후에는 올해 시즌만 갱신해서 1~2분이면 끝나요.
#   - 네이버 데이터 서버는 파이썬의 기본 접속 방식(TLS 1.3)에는 응답하지 않고 TLS 1.2에는 응답해요.
#     스크립트가 시작할 때 되는 방식을 자동으로 골라요. 로그의 "전송 방식: …" 줄에서 확인할 수 있어요.
#   - 200분이 지나면 스스로 멈추고, 그때까지 받은 시즌은 저장해요. 다시 실행하면 이어서 받아요.
#   - 이 작업이 실패하면 update_kbo.bat(내 PC)로 대신 받을 수 있어요. 계속 실패하면 아래 schedule 줄을 지워도 돼요.
#
# Actions 탭에서 'Run workflow'로 수동 실행도 가능해요.
#   - '다시 받을 연도'에 2024,2025 처럼 적으면 그 해만 새로 받아요 (비워두면 올해만 갱신).
#   - all 이라고 적으면 보관된 모든 시즌을 처음부터 다시 받아요. (구장 정보가 없던 예전 파일을 새로 받을 때 쓰세요)
name: KBO 결과 자동 수집

on:
  schedule:
    - cron: "10 15 * * *"   # UTC 15:10 = 한국 시간 00:10
  workflow_dispatch:
    inputs:
      refresh_years:
        description: "다시 받을 연도 (예: 2024,2025 / 전부 다시 받으려면 all). 비워두면 올해만 갱신"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 창단일 (YYYY-MM-DD). 이 날짜가 속한 해부터 올해까지 모든 시즌을 저장해요.
  FOUNDING_DATE: "2011-03-31"
  REFRESH_YEARS: ${{ inputs.refresh_years }}
  PYTHONUNBUFFERED: "1"        # 진행 상황이 로그에 바로바로 보이게 해요

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 스크립트 파일 점검
        run: |
          LINES=$(wc -l < fetch_naver_kbo.py)
          BYTES=$(wc -c < fetch_naver_kbo.py)
          echo "fetch_naver_kbo.py: ${LINES}줄, ${BYTES}바이트 (정상 파일: 682줄, 30,896바이트)"
          if ! python -m py_compile fetch_naver_kbo.py; then
            {
              echo "### ❌ fetch_naver_kbo.py 파일이 잘렸거나 깨졌어요"
              echo "- 저장소의 파일: ${LINES}줄, ${BYTES}바이트 / 정상: 682줄, 30,896바이트"
              echo "- 해결: 내용을 복사·붙여넣지 말고, 컴퓨터에 저장된 원본 파일을 Add file → Upload files 로 끌어다 올려주세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::fetch_naver_kbo.py 가 잘렸어요 (${LINES}줄, ${BYTES}바이트). 정상은 682줄, 30,896바이트예요."
            exit 1
          fi

      - name: 창단 이후 모든 시즌 수집·보관
        id: fetch
        continue-on-error: true      # 일부 시즌 수집에 실패해도, 받은 시즌은 아래에서 저장해요
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$REFRESH_YEARS" ]; then ARGS="--refresh-years $REFRESH_YEARS"; fi
          python -u fetch_naver_kbo.py --archive-dir data --founding "$FOUNDING_DATE" --strict --max-minutes 200 $ARGS 2>&1 | tee fetch.log

      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "KBO 결과 자동 업데이트 $(TZ=Asia/Seoul date +'%F %R')"
            git push
          fi

      - name: 실행 결과 요약
        if: always()
        run: |
          {
            echo "### 수집 결과 요약"
            echo "- 수집 단계: **${{ steps.fetch.outcome }}**"
            echo "- 스크립트 파일: $(wc -l < fetch_naver_kbo.py)줄 / $(wc -c < fetch_naver_kbo.py)바이트 (정상 682줄 / 30,896바이트)"
            echo
            echo '```'
            if [ -f fetch.log ]; then
              grep -E "전송 방식|시작:|저장:|건너뛰|보관된 시즌|네이버가 주지|다시 실행|응답이 없|실패|시간 제한|⚠|※|Traceback|Error" fetch.log | tail -n 60
            else
              echo "(수집 로그가 없어요 - 수집 단계가 시작되기 전에 멈췄어요)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 일부 시즌을 받지 못했다면 알림
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "일부 시즌을 받지 못했어요. 아래는 수집 로그의 마지막 부분이에요. (전체는 '수집 단계'를 펼치면 볼 수 있어요)"
          echo "-----"
          tail -n 40 fetch.log || true
          exit 1
