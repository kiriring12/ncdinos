<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBO 야구 기록장 (NC 다이노스 중심)</title>
<style>
    :root {
        --primary-color: #315288; /* NC Dinos Blue */
        --accent-color: #D1B27B; /* Gold */
        --bg-color: #f8f9fa;
        --border-color: #ddd;
    }
    body {
        font-family: 'Malgun Gothic', sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        color: #333;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .nav-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    .nav-buttons button {
        flex: 1;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        background-color: #eee;
        cursor: pointer;
        border-radius: 5px;
        transition: 0.3s;
    }
    .nav-buttons button.active {
        background-color: var(--primary-color);
        color: #fff;
    }
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
    }

    /* 입력 폼 스타일 */
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid var(--border-color);
        border-radius: 4px;
    }
    .matchup-container {
        display: flex;
        gap: 20px;
        background: #f1f3f5;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
    }
    .team-box {
        flex: 1;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
    }
    .team-box h3 {
        text-align: center;
        margin-top: 0;
        color: var(--primary-color);
    }
    .submit-btn {
        width: 100%;
        padding: 15px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }
    .submit-btn:hover { background-color: #233b63; }

    /* 캘린더 스타일 */
    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .calendar-header button {
        padding: 5px 15px;
        font-size: 16px;
        cursor: pointer;
    }
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
    }
    .cal-day-name {
        text-align: center;
        font-weight: bold;
        padding: 10px;
        background: var(--primary-color);
        color: white;
    }
    .cal-cell {
        min-height: 80px;
        border: 1px solid var(--border-color);
        padding: 5px;
        background: #fff;
        cursor: pointer;
        position: relative;
    }
    .cal-cell:hover { background: #e9ecef; }
    .cal-date { font-weight: bold; font-size: 14px; }
    .cal-game-info {
        font-size: 11px;
        margin-top: 5px;
        color: #555;
        word-break: keep-all;
    }
    .nc-win { color: blue; font-weight: bold;}
    .nc-loss { color: red; font-weight: bold;}
    .nc-draw { color: green; font-weight: bold;}

    .stats-container {
        text-align: right;
        margin-top: 15px;
        padding: 15px;
        background: #e9ecef;
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.6;
    }

    /* 랭킹 스타일 */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        border: 1px solid var(--border-color);
        padding: 10px;
        text-align: center;
    }
    th {
        background-color: var(--primary-color);
        color: white;
    }

    /* 모달 (상세 정보 팝업) */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        align-items: center; justify-content: center;
    }
    .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        width: 400px;
        max-width: 90%;
    }
    .modal-close {
        float: right;
        cursor: pointer;
        font-size: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <div class="nav-buttons">
        <button id="btn-input" class="active" onclick="switchTab('input')">경기 입력</button>
        <button id="btn-calendar" onclick="switchTab('calendar')">캘린더</button>
        <button id="btn-ranking" onclick="switchTab('ranking')">순위표</button>
    </div>

    <div id="tab-input" class="tab-content active">
        <h2>경기 정보 입력</h2>
        <div class="form-group">
            <label>날짜</label>
            <input type="date" id="in-date">
        </div>
        <div class="form-group">
            <label>구장</label>
            <input type="text" id="in-stadium" placeholder="예: 창원NC파크">
        </div>

        <div class="matchup-container">
            <div class="team-box">
                <h3>AWAY (원정)</h3>
                <div class="form-group">
                    <label>팀</label>
                    <select id="in-away-team"></select>
                </div>
                <div class="form-group">
                    <label>점수</label>
                    <input type="number" id="in-away-score" min="0" value="0">
                </div>
                <div class="form-group">
                    <label>선발투수</label>
                    <input type="text" id="in-away-pitcher">
                </div>
                <div class="form-group">
                    <label>MVP 플레이어</label>
                    <input type="text" id="in-away-mvp">
                </div>
            </div>

            <div class="team-box">
                <h3>HOME (홈)</h3>
                <div class="form-group">
                    <label>팀</label>
                    <select id="in-home-team"></select>
                </div>
                <div class="form-group">
                    <label>점수</label>
                    <input type="number" id="in-home-score" min="0" value="0">
                </div>
                <div class="form-group">
                    <label>선발투수</label>
                    <input type="text" id="in-home-pitcher">
                </div>
                <div class="form-group">
                    <label>MVP 플레이어</label>
                    <input type="text" id="in-home-mvp">
                </div>
            </div>
        </div>
        <button class="submit-btn" onclick="saveGame()">저장하기</button>
    </div>

    <div id="tab-calendar" class="tab-content">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 이전 달</button>
            <h2 id="cal-title">2026년 8월</h2>
            <button onclick="changeMonth(1)">다음 달 ▶</button>
        </div>
        <div class="calendar-grid" id="cal-grid">
            </div>
        
        <div class="stats-container" id="stats-display">
            </div>
    </div>

    <div id="tab-ranking" class="tab-content">
        <h2>시즌 전체 순위표 (승률순)</h2>
        <table>
            <thead>
                <tr>
                    <th>순위</th>
                    <th>팀</th>
                    <th>경기수</th>
                    <th>승</th>
                    <th>무</th>
                    <th>패</th>
                    <th>승률</th>
                </tr>
            </thead>
            <tbody id="ranking-tbody">
                </tbody>
        </table>
    </div>
</div>

<div id="detail-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">×</span>
        <h3 id="modal-title">경기 정보</h3>
        <div id="modal-body"></div>
    </div>
</div>

<script>
    const KBO_TEAMS = ["NC 다이노스", "롯데 자이언츠", "삼성 라이온즈", "KIA 타이거즈", "한화 이글스", "KT wiz", "두산 베어스", "LG 트윈스", "SSG 랜더스", "키움 히어로즈"];
    let games = JSON.parse(localStorage.getItem('kbo_games')) || [];
    let currentYear = 2026;
    let currentMonth = 8; // 1~12

    // 초기화
    window.onload = function() {
        // 날짜 기본값 오늘로 셋팅
        document.getElementById('in-date').valueAsDate = new Date();
        
        // 팀 셀렉트 박스 세팅
        const awaySelect = document.getElementById('in-away-team');
        const homeSelect = document.getElementById('in-home-team');
        KBO_TEAMS.forEach(team => {
            awaySelect.add(new Option(team, team));
            homeSelect.add(new Option(team, team));
        });
        // 기본 선택 다르게
        homeSelect.value = "NC 다이노스";
        awaySelect.value = "롯데 자이언츠";
    };

    // 탭 전환
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-buttons button').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.getElementById(`btn-${tab}`).classList.add('active');

        if(tab === 'calendar') renderCalendar();
        if(tab === 'ranking') renderRanking();
    }

    // 경기 저장
    function saveGame() {
        const date = document.getElementById('in-date').value;
        const stadium = document.getElementById('in-stadium').value;
        const awayTeam = document.getElementById('in-away-team').value;
        const homeTeam = document.getElementById('in-home-team').value;
        const awayScore = parseInt(document.getElementById('in-away-score').value);
        const homeScore = parseInt(document.getElementById('in-home-score').value);
        const awayPitcher = document.getElementById('in-away-pitcher').value;
        const homePitcher = document.getElementById('in-home-pitcher').value;
        const awayMVP = document.getElementById('in-away-mvp').value;
        const homeMVP = document.getElementById('in-home-mvp').value;

        if(!date || awayTeam === homeTeam) {
            alert("날짜를 입력하시고, 서로 다른 팀을 선택해주세요.");
            return;
        }

        const newGame = {
            id: Date.now(), date, stadium, awayTeam, homeTeam, 
            awayScore, homeScore, awayPitcher, homePitcher, awayMVP, homeMVP
        };

        // 같은 날짜 중복 제거(원한다면 주석 처리)
        // games = games.filter(g => g.date !== date); 
        
        games.push(newGame);
        localStorage.setItem('kbo_games', JSON.stringify(games));
        
        alert("경기 정보가 저장되었습니다.");
        
        // 폼 초기화 (일부)
        document.getElementById('in-away-score').value = 0;
        document.getElementById('in-home-score').value = 0;
        document.getElementById('in-away-pitcher').value = "";
        document.getElementById('in-home-pitcher').value = "";
        document.getElementById('in-away-mvp').value = "";
        document.getElementById('in-home-mvp').value = "";
    }

    // 달력 달 변경
    function changeMonth(diff) {
        currentMonth += diff;
        if (currentMonth > 12) { currentMonth = 1; currentYear++; }
        else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
        renderCalendar();
    }

    // 승률 계산 함수 (승 / (승+패)) 소수점 4번째 자리에서 반올림
    function calcWinRate(w, l) {
        if (w + l === 0) return "0.000";
        return (w / (w + l)).toFixed(3);
    }

    // 캘린더 렌더링
    function renderCalendar() {
        document.getElementById('cal-title').innerText = `${currentYear}년 ${currentMonth}월`;
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';

        const days = ['일', '월', '화', '수', '목', '금', '토'];
        days.forEach(d => {
            const div = document.createElement('div');
            div.className = 'cal-day-name';
            div.innerText = d;
            grid.appendChild(div);
        });

        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
        const lastDate = new Date(currentYear, currentMonth, 0).getDate();

        // 빈 칸 채우기
        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'cal-cell';
            empty.style.visibility = 'hidden';
            grid.appendChild(empty);
        }

        // 날짜 채우기
        for (let i = 1; i <= lastDate; i++) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell';
            
            const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            
            cell.innerHTML = `<div class="cal-date">${i}</div>`;
            cell.onclick = () => showGameDetail(dateStr);

            // 해당 날짜에 NC 다이노스 경기가 있는지 확인
            const dailyGames = games.filter(g => g.date === dateStr && (g.awayTeam === 'NC 다이노스' || g.homeTeam === 'NC 다이노스'));
            
            dailyGames.forEach(g => {
                const isNC_Away = g.awayTeam === 'NC 다이노스';
                const ncScore = isNC_Away ? g.awayScore : g.homeScore;
                const opScore = isNC_Away ? g.homeScore : g.awayScore;
                const opTeam = isNC_Away ? g.homeTeam : g.awayTeam;
                const place = isNC_Away ? '@' : 'vs'; // 원정이면 @팀, 홈이면 vs팀

                let resultStr = "무";
                let resultClass = "nc-draw";
                if(ncScore > opScore) { resultStr = "승"; resultClass = "nc-win"; }
                else if(ncScore < opScore) { resultStr = "패"; resultClass = "nc-loss"; }

                cell.innerHTML += `<div class="cal-game-info">
                    ${place}${opTeam}<br>
                    <span class="${resultClass}">${resultStr}</span> (${g.awayScore}:${g.homeScore})
                </div>`;
            });

            grid.appendChild(cell);
        }

        renderStats();
    }

    // NC 다이노스 스탯 렌더링 (우측 하단)
    function renderStats() {
        let m_W=0, m_L=0, m_D=0;
        let s_W=0, s_L=0, s_D=0;

        games.forEach(g => {
            if (g.awayTeam !== 'NC 다이노스' && g.homeTeam !== 'NC 다이노스') return;

            const gDate = new Date(g.date);
            const isNC_Away = g.awayTeam === 'NC 다이노스';
            const ncScore = isNC_Away ? g.awayScore : g.homeScore;
            const opScore = isNC_Away ? g.homeScore : g.awayScore;
            
            let isWin = ncScore > opScore;
            let isLoss = ncScore < opScore;
            let isDraw = ncScore === opScore;

            // 2026 시즌 통산 (기준년도)
            if (gDate.getFullYear() === 2026) {
                if(isWin) s_W++; else if(isLoss) s_L++; else s_D++;
            }
            
            // 현재 보고 있는 월
            if (gDate.getFullYear() === currentYear && gDate.getMonth() + 1 === currentMonth) {
                if(isWin) m_W++; else if(isLoss) m_L++; else m_D++;
            }
        });

        const statsDiv = document.getElementById('stats-display');
        statsDiv.innerHTML = `
            <strong>[NC 다이노스 성적 요약]</strong><br>
            ${currentMonth}월: ${m_W}승 ${m_D}무 ${m_L}패 (승률 ${calcWinRate(m_W, m_L)})<br>
            2026시즌 통산: ${s_W}승 ${s_D}무 ${s_L}패 (승률 ${calcWinRate(s_W, s_L)})
        `;
    }

    // 모달 띄우기
    function showGameDetail(dateStr) {
        const dailyGames = games.filter(g => g.date === dateStr);
        const body = document.getElementById('modal-body');
        document.getElementById('modal-title').innerText = `${dateStr} 경기 정보`;

        if(dailyGames.length === 0) {
            body.innerHTML = "<p>이 날짜에 기록된 경기가 없습니다.</p>";
        } else {
            body.innerHTML = dailyGames.map(g => `
                <div style="border-bottom:1px solid #ddd; padding-bottom:10px; margin-bottom:10px;">
                    <strong>구장:</strong> ${g.stadium || '미입력'}<br>
                    <strong>매치:</strong> ${g.awayTeam} (AWAY) vs ${g.homeTeam} (HOME)<br>
                    <strong>점수:</strong> ${g.awayScore} : ${g.homeScore}<br>
                    <strong>선발투수:</strong> ${g.awayPitcher||'미입력'} (AWAY) / ${g.homePitcher||'미입력'} (HOME)<br>
                    <strong>MVP:</strong> ${g.awayMVP||'미입력'} (AWAY) / ${g.homeMVP||'미입력'} (HOME)
                </div>
            `).join('');
        }
        document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detail-modal').style.display = 'none';
    }

    // 순위표 렌더링
    function renderRanking() {
        const tbody = document.getElementById('ranking-tbody');
        tbody.innerHTML = '';

        let teamStats = {};
        KBO_TEAMS.forEach(t => teamStats[t] = { w: 0, l: 0, d: 0, total: 0 });

        // 기록된 모든 경기를 바탕으로 10개 구단 승패 계산
        games.forEach(g => {
            if(!teamStats[g.awayTeam] || !teamStats[g.homeTeam]) return;

            teamStats[g.awayTeam].total++;
            teamStats[g.homeTeam].total++;

            if(g.awayScore > g.homeScore) {
                teamStats[g.awayTeam].w++;
                teamStats[g.homeTeam].l++;
            } else if(g.awayScore < g.homeScore) {
                teamStats[g.awayTeam].l++;
                teamStats[g.homeTeam].w++;
            } else {
                teamStats[g.awayTeam].d++;
                teamStats[g.homeTeam].d++;
            }
        });

        // 배열로 변환 및 정렬 (승률 내림차순 -> 승수 내림차순)
        let rankArr = KBO_TEAMS.map(t => {
            let s = teamStats[t];
            let rate = s.w + s.l === 0 ? 0 : s.w / (s.w + s.l);
            return { team: t, ...s, rateValue: rate, rateStr: calcWinRate(s.w, s.l) };
        });

        rankArr.sort((a, b) => {
            if (b.rateValue !== a.rateValue) return b.rateValue - a.rateValue;
            return b.w - a.w; // 승률이 같으면 승수가 많은 팀 우선
        });

        rankArr.forEach((r, idx) => {
            const tr = document.createElement('tr');
            // NC 다이노스 행에 하이라이트 부여
            if(r.team === 'NC 다이노스') tr.style.backgroundColor = '#e8f0fe';
            
            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td>${r.team}</td>
                <td>${r.total}</td>
                <td>${r.w}</td>
                <td>${r.d}</td>
                <td>${r.l}</td>
                <td><strong>${r.rateStr}</strong></td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
