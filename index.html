<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC 다이노스 직관 기록판</title>
<style>
  :root{
    --bg:#F5F6F3;
    --panel:#FFFFFF;
    --ink:#152232;
    --ink-soft:#5B6672;
    --line:#E1E4DF;
    --navy:#1E3A5F;
    --navy-deep:#132840;
    --navy-soft:#EAF0F7;
    --gold:#C89B3C;
    --win:#2F8F5B;
    --win-bg:#E7F5EC;
    --loss:#C64B4B;
    --loss-bg:#FBEAEA;
    --draw:#B4862E;
    --draw-bg:#FBF2E1;
    --cancel:#8A93A0;
    --cancel-bg:#EEF0F2;
    --radius:10px;
    --shadow:0 1px 2px rgba(21,34,50,.06), 0 4px 14px rgba(21,34,50,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  .tabular{font-variant-numeric:tabular-nums;}

  /* Header */
  header.top{
    background:linear-gradient(180deg,var(--navy-deep) 0%, var(--navy) 100%);
    color:#fff;
    padding:22px 24px 0 24px;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; margin-bottom:18px;
  }
  .brand .logo-mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--navy-deep);font-size:16px;
    flex:none;
  }
  .brand h1{
    font-size:19px; font-weight:700; margin:0; letter-spacing:.2px;
  }
  .brand span.sub{
    color:#B9C7D8; font-size:12.5px; font-weight:400;
  }
  nav.tabs{
    display:flex; gap:2px; max-width:1180px; margin:0 auto;
  }
  nav.tabs button{
    appearance:none; border:none; background:transparent;
    color:#AFC0D4; padding:11px 18px; font-size:14.5px; font-weight:600;
    cursor:pointer; border-radius:8px 8px 0 0;
    transition:background .15s, color .15s;
  }
  nav.tabs button:hover{ color:#fff; background:rgba(255,255,255,.06); }
  nav.tabs button.active{
    background:var(--bg); color:var(--navy-deep);
  }

  main{
    max-width:1180px; margin:0 auto; padding:22px 20px 10px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  h2.section-title{
    font-size:15px; font-weight:700; margin:0 0 14px; color:var(--navy-deep);
  }
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- Input Tab ---------- */
  .form-wrap{ padding:22px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .field{ flex:1; min-width:150px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; color:var(--ink); background:#fff; font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-soft);
  }
  .matchup{
    display:grid; grid-template-columns:1fr 40px 1fr; gap:12px; align-items:start; margin-bottom:6px;
  }
  .side-card{
    border:1px solid var(--line); border-radius:9px; padding:14px; background:#FBFCFA;
  }
  .side-card.away{ border-left:4px solid var(--ink-soft); }
  .side-card.home{ border-left:4px solid var(--gold); }
  .side-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .side-label.away-c{color:#6B7480;}
  .side-label.home-c{color:#9A7418;}
  .vs-mark{
    display:flex; align-items:center; justify-content:center; height:100%;
    font-size:12px; font-weight:700; color:var(--ink-soft); padding-top:36px;
  }
  .toggle-row{ display:flex; gap:10px; align-items:center; margin:16px 0; flex-wrap:wrap; }
  .chip-toggle{
    display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:20px;
    border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); user-select:none;
  }
  .chip-toggle input{ display:none; }
  .chip-toggle.on-watch.checked{ background:var(--navy-soft); border-color:var(--navy); color:var(--navy-deep); }
  .chip-toggle.on-cancel.checked{ background:var(--loss-bg); border-color:var(--loss); color:var(--loss); }
  .cancel-reason-box{
    display:none; margin-top:6px;
  }
  .cancel-reason-box.show{ display:block; }
  .form-actions{ display:flex; gap:10px; margin-top:18px; align-items:center; }
  button.primary{
    background:var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:8px;
    font-size:14.5px; font-weight:700; cursor:pointer;
  }
  button.primary:hover{ background:var(--navy-deep); }
  button.ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line); padding:11px 18px; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  button.ghost:hover{ background:#F0F1EE; }
  #editingNotice{
    display:none; background:var(--draw-bg); color:var(--draw); border:1px solid #EAD6A0;
    padding:8px 12px; border-radius:7px; font-size:13px; font-weight:600; margin-bottom:14px;
  }
  #editingNotice.show{ display:block; }
  #toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Calendar Tab ---------- */
  .cal-wrap{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
  .cal-left{ flex:2; min-width:340px; padding:18px; }
  .cal-right{ flex:1; min-width:270px; display:flex; flex-direction:column; gap:16px; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav .ym{ font-size:17px; font-weight:800; color:var(--navy-deep); }
  .cal-nav button{
    background:var(--navy-soft); border:none; color:var(--navy-deep); width:32px;height:32px;border-radius:7px;
    cursor:pointer; font-size:15px; font-weight:700;
  }
  .cal-nav button:hover{ background:#DCE7F3; }
  table.cal-grid{ width:100%; border-collapse:collapse; table-layout:fixed; }
  table.cal-grid th{
    font-size:11.5px; color:var(--ink-soft); font-weight:700; padding:6px 0; text-align:center;
  }
  table.cal-grid td{
    border:1px solid var(--line); vertical-align:top; height:78px; padding:6px; cursor:default;
    transition:background .1s;
  }
  table.cal-grid td.has-game{ cursor:pointer; }
  table.cal-grid td.has-game:hover{ background:#F5F8FB; }
  table.cal-grid td.empty{ background:#FAFAF8; border-color:#EEEFEC; }
  table.cal-grid td.selected{ background:var(--navy-soft); border-color:var(--navy); }
  .day-num{ font-size:12px; font-weight:700; color:var(--ink-soft); }
  td.today .day-num{ color:var(--navy); }
  td.today{ box-shadow:inset 0 0 0 1.5px var(--navy); }
  .badge{
    display:inline-block; margin-top:5px; font-size:11px; font-weight:800; padding:2px 6px; border-radius:5px;
  }
  .badge.win{ background:var(--win-bg); color:var(--win); }
  .badge.loss{ background:var(--loss-bg); color:var(--loss); }
  .badge.draw{ background:var(--draw-bg); color:var(--draw); }
  .badge.cancel{ background:var(--cancel-bg); color:var(--cancel); text-decoration:line-through; }
  .badge.sched{ background:#E7EEF7; color:#5A7CA6; }
  .watch-dot{ color:var(--gold); font-size:10px; margin-left:3px; }

  .detail-panel{ padding:16px; min-height:170px; }
  .detail-empty{ color:var(--ink-soft); font-size:13.5px; padding:20px 4px; text-align:center; }
  .detail-game{ border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:12px; }
  .detail-game:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .detail-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .detail-date{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .score-line{ display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0; }
  .score-team{ text-align:center; flex:1; }
  .score-team .tname{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:3px; }
  .score-team .tscore{ font-size:26px; font-weight:800; color:var(--navy-deep); }
  .score-sep{ font-size:15px; color:var(--ink-soft); font-weight:700; }
  .detail-meta{ font-size:12.5px; color:var(--ink-soft); }
  .detail-meta div{ margin-bottom:3px; }
  .detail-meta b{ color:var(--ink); font-weight:600; }
  .detail-actions{ display:flex; gap:8px; margin-top:10px; }
  .detail-actions button{
    font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#fff;
    cursor:pointer; color:var(--ink-soft); font-weight:600;
  }
  .detail-actions button:hover{ background:#F1F2EF; }
  .cancel-tag{ display:inline-block; background:var(--loss-bg); color:var(--loss); font-size:11px; font-weight:800; padding:2px 7px; border-radius:5px; }
  .watch-tag{ display:inline-block; background:var(--navy-soft); color:var(--navy-deep); font-size:11px; font-weight:800; padding:2px 7px; border-radius:5px; margin-left:6px;}

  .stats-panel{ padding:18px; }
  .stat-block + .stat-block{ margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .stat-block .label{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
  .stat-record{ font-size:18px; font-weight:800; color:var(--navy-deep); }
  .stat-rate{ font-size:13.5px; color:var(--ink-soft); margin-top:3px; }
  .stat-rate b{ color:var(--navy); font-size:15px; }

  /* ---------- Other teams tab ---------- */
  .table-wrap{ padding:18px; overflow-x:auto; }
  .table-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  select.filter-select{
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; background:#fff;
  }
  table.data-table{ width:100%; border-collapse:collapse; min-width:760px; }
  table.data-table th{
    text-align:left; font-size:12px; color:var(--ink-soft); font-weight:700; padding:8px 10px;
    border-bottom:2px solid var(--line); white-space:nowrap;
  }
  table.data-table td{
    padding:9px 10px; font-size:13px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.data-table tr:hover td{ background:#FAFBFA; }
  .row-btn{
    font-size:11.5px; padding:4px 9px; border-radius:6px; border:1px solid var(--line); background:#fff;
    cursor:pointer; color:var(--ink-soft); font-weight:600; margin-right:5px;
  }
  .row-btn:hover{ background:#F1F2EF; }
  .empty-row td{ text-align:center; color:var(--ink-soft); padding:30px; }

  /* ---------- Ranking tab ---------- */
  .rank-wrap{ padding:18px; }
  table.rank-table{ width:100%; border-collapse:collapse; }
  table.rank-table th{
    text-align:left; font-size:12px; color:var(--ink-soft); font-weight:700; padding:9px 10px; border-bottom:2px solid var(--line);
  }
  table.rank-table td{ padding:11px 10px; font-size:14px; border-bottom:1px solid var(--line); }
  table.rank-table tr.nc-row td{ background:var(--navy-soft); font-weight:700; }
  .rank-no{ font-weight:800; color:var(--ink-soft); width:28px; }
  .rank-no.top1{ color:var(--gold); }
  td.rate-cell{ font-weight:800; color:var(--navy-deep); }

  @media (max-width:720px){
    .matchup{ grid-template-columns:1fr; }
    .vs-mark{ padding-top:0; }
    table.cal-grid td{ height:60px; padding:4px; }
    .badge{ font-size:9.5px; padding:1px 4px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo-mark">NC</div>
    <h1>NC 다이노스 직관 기록판 <span class="sub">— 월간 승률 트래커</span></h1>
  </div>
  <nav class="tabs" id="tabNav">
    <button data-tab="input" class="active">경기 입력</button>
    <button data-tab="calendar">캘린더</button>
    <button data-tab="other">타 팀 기록</button>
    <button data-tab="ranking">랭킹</button>
  </nav>
</header>

<main>

  <!-- ================= INPUT TAB ================= -->
  <section id="tab-input">
    <div class="panel form-wrap">
      <div id="editingNotice">✏️ 기존 경기를 수정하는 중입니다. <button type="button" class="row-btn" id="cancelEditBtn" style="margin-left:8px;">수정 취소</button></div>
      <h2 class="section-title">경기 기록 입력</h2>

      <div class="field-row">
        <div class="field" style="max-width:220px;">
          <label>날짜</label>
          <input type="date" id="f-date">
        </div>
        <div class="field" style="max-width:260px;">
          <label>구장 <span style="font-weight:400;">(비워두면 홈팀 기준 자동 입력)</span></label>
          <input type="text" id="f-stadium" placeholder="예: 창원NC파크">
        </div>
      </div>

      <div class="matchup">
        <div class="side-card away">
          <div class="side-label away-c">⬅ 어웨이팀</div>
          <div class="field" style="margin-bottom:10px;">
            <label>팀</label>
            <select id="f-awayTeam"></select>
          </div>
          <div class="field" style="margin-bottom:10px;">
            <label>선발투수</label>
            <input type="text" id="f-awayPitcher" placeholder="선발투수 이름">
          </div>
          <div class="field" style="margin-bottom:10px;">
            <label>점수</label>
            <input type="number" id="f-awayScore" min="0" placeholder="0">
          </div>
          <div class="field">
            <label>MVP</label>
            <input type="text" id="f-awayMVP" placeholder="이 날의 MVP">
          </div>
        </div>
        <div class="vs-mark">VS</div>
        <div class="side-card home">
          <div class="side-label home-c">홈팀 ➡</div>
          <div class="field" style="margin-bottom:10px;">
            <label>팀</label>
            <select id="f-homeTeam"></select>
          </div>
          <div class="field" style="margin-bottom:10px;">
            <label>선발투수</label>
            <input type="text" id="f-homePitcher" placeholder="선발투수 이름">
          </div>
          <div class="field" style="margin-bottom:10px;">
            <label>점수</label>
            <input type="number" id="f-homeScore" min="0" placeholder="0">
          </div>
          <div class="field">
            <label>MVP</label>
            <input type="text" id="f-homeMVP" placeholder="이 날의 MVP">
          </div>
        </div>
      </div>
      <div class="hint" id="stadiumHint"></div>

      <div class="field-row" style="margin-top:4px;">
        <div class="field">
          <label>승리투수</label>
          <input type="text" id="f-winPitcher" placeholder="승리투수 이름">
        </div>
        <div class="field">
          <label>패전투수</label>
          <input type="text" id="f-losePitcher" placeholder="패전투수 이름">
        </div>
        <div class="field">
          <label>세이브</label>
          <input type="text" id="f-savePitcher" placeholder="세이브투수 이름">
        </div>
        <div class="field">
          <label>홀드 <span style="font-weight:400;">(여러 명은 쉼표로 구분)</span></label>
          <input type="text" id="f-holdPitcher" placeholder="예: 이용준, 김영규">
        </div>
      </div>

      <div class="toggle-row">
        <label class="chip-toggle on-watch" id="watchToggle">
          <input type="checkbox" id="f-watch">
          <span>⚾ 직관</span>
        </label>
        <label class="chip-toggle on-cancel" id="cancelToggle">
          <input type="checkbox" id="f-cancel">
          <span>🚫 경기 취소</span>
        </label>
      </div>

      <div class="field cancel-reason-box" id="cancelReasonBox">
        <label>취소 사유</label>
        <textarea id="f-cancelReason" rows="2" placeholder="예: 우천취소"></textarea>
      </div>

      <div class="form-actions">
        <button class="primary" id="saveBtn">저장하기</button>
        <button class="ghost" id="resetBtn">입력 초기화</button>
      </div>
    </div>
  </section>

  <!-- ================= CALENDAR TAB ================= -->
  <section id="tab-calendar" style="display:none;">
    <div class="cal-wrap">
      <div class="panel cal-left">
        <div class="cal-nav">
          <button id="prevMonth">‹</button>
          <div class="ym" id="calYM">2026년 8월</div>
          <button id="nextMonth">›</button>
        </div>
        <table class="cal-grid">
          <thead>
            <tr><th style="color:#C64B4B;">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th style="color:#3B6FBF;">토</th></tr>
          </thead>
          <tbody id="calBody"></tbody>
        </table>
      </div>
      <div class="cal-right">
        <div class="panel detail-panel" id="detailPanel">
          <h2 class="section-title">경기 상세</h2>
          <div class="detail-empty">날짜를 클릭하면 그 날의 NC 경기 기록을 볼 수 있어요.</div>
        </div>
        <div class="panel stats-panel" id="statsPanel"></div>
      </div>
    </div>
  </section>

  <!-- ================= OTHER TEAMS TAB ================= -->
  <section id="tab-other" style="display:none;">
    <div class="panel table-wrap">
      <div class="table-toolbar">
        <h2 class="section-title" style="margin:0;">타 팀 기록 (NC 다이노스 제외)</h2>
        <select class="filter-select" id="otherFilter"></select>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>날짜</th><th>어웨이</th><th>스코어</th><th>홈</th><th>구장</th><th>직관</th><th>비고</th><th></th>
          </tr>
        </thead>
        <tbody id="otherBody"></tbody>
      </table>
    </div>
  </section>

  <!-- ================= RANKING TAB ================= -->
  <section id="tab-ranking" style="display:none;">
    <div class="panel rank-wrap">
      <h2 class="section-title">2026시즌 팀 순위 (승률순 · 입력된 경기 기준)</h2>
      <table class="rank-table">
        <thead>
          <tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>승률</th></tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </section>

</main>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var TEAMS = ["NC 다이노스","롯데 자이언츠","삼성 라이온즈","KIA 타이거즈","한화 이글스","KT wiz","두산 베어스","LG 트윈스","SSG 랜더스","키움 히어로즈"];
  var STADIUM_MAP = {
    "NC 다이노스":"창원NC파크",
    "롯데 자이언츠":"사직 야구장",
    "삼성 라이온즈":"대구 삼성 라이온즈 파크",
    "KIA 타이거즈":"광주-기아 챔피언스 필드",
    "한화 이글스":"대전 한화생명 볼파크",
    "KT wiz":"수원 케이티 위즈 파크",
    "SSG 랜더스":"인천 SSG 랜더스필드",
    "두산 베어스":"서울종합운동장 잠실 야구장",
    "LG 트윈스":"서울종합운동장 잠실 야구장",
    "키움 히어로즈":"고척 스카이돔"
  };
  var STORAGE_KEY = "nc_dinos_game_records_v1";
  var NC = "NC 다이노스";

  var state = {
    games: load(),
    activeTab: "input",

  };
  // Default calendar to a month that actually has data if current month/year unset properly.
  if(!state.calYear) state.calYear = 2026;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.games)); }catch(e){}
  }
  function uid(){ return "g_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }

  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function fmtDate(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }

  // ---------------- Tabs ----------------
  var tabNav = document.getElementById("tabNav");
  tabNav.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    setActiveTab(btn.getAttribute("data-tab"));
  });
  function setActiveTab(tab){
    state.activeTab = tab;
    ["input","calendar","other","ranking"].forEach(function(t){
      document.getElementById("tab-"+t).style.display = (t===tab) ? "" : "none";
    });
    Array.prototype.forEach.call(tabNav.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===tab);
    });

  otherFilter.addEventListener("change", renderOtherTab);

  // default date = today
  document.getElementById("f-date").value = new Date().toISOString().slice(0,10);

  // ---------------- Stadium auto-fill ----------------
  var stadiumInput = document.getElementById("f-stadium");
  var stadiumHint = document.getElementById("stadiumHint");

    var homeTeam = homeSel.value;

      stadiumInput.value = def;
    }

  }
  homeSel.addEventListener("change", function(){
    state.stadiumAutoOk = true;
    applyStadiumDefault();
  });
  stadiumInput.addEventListener("input", function(){
    state.stadiumAutoOk = (stadiumInput.value.trim()==="");
  });

  // prevent same team both sides -> auto swap warning
  function validateTeams(){
    if(awaySel.value === homeSel.value){

  // ---------------- Toggles ----------------
  var watchToggle = document.getElementById("watchToggle");

  var cancelToggle = document.getElementById("cancelToggle");

    cancelToggle.classList.toggle("checked", cancelCb.checked);
    cancelReasonBox.classList.toggle("show", cancelCb.checked);
  });

  // ---------------- Save / Reset ----------------
  document.getElementById("resetBtn").addEventListener("click", function(){

  });
  document.getElementById("cancelEditBtn").addEventListener("click", function(){

  });

  function resetForm(){
    state.editingId = null;
    document.getElementById("editingNotice").classList.remove("show");
    document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
    awaySel.value = "롯데 자이언츠";
    homeSel.value = NC;
    document.getElementById("f-awayPitcher").value = "";
    document.getElementById("f-homePitcher").value = "";
    document.getElementById("f-awayScore").value = "";
    document.getElementById("f-homeScore").value = "";
    document.getElementById("f-awayMVP").value = "";
    document.getElementById("f-homeMVP").value = "";
    document.getElementById("f-winPitcher").value = "";
    document.getElementById("f-losePitcher").value = "";
    document.getElementById("f-savePitcher").value = "";
    document.getElementById("f-holdPitcher").value = "";
    watchCb.checked = false; watchToggle.classList.remove("checked");
    cancelCb.checked = false; cancelToggle.classList.remove("checked");

  document.getElementById("saveBtn").addEventListener("click", function(){
    var date = document.getElementById("f-date").value;
    if(!date){ toast("날짜를 입력해주세요."); return; }
    if(!validateTeams()){ toast("어웨이팀과 홈팀은 서로 달라야 합니다."); return; }
    var cancel = cancelCb.checked;
    var cancelReason = document.getElementById("f-cancelReason").value.trim();
    if(cancel && !cancelReason){ toast("취소 사유를 입력해주세요."); return; }

    var stadium = stadiumInput.value.trim() || STADIUM_MAP[homeSel.value] || "";

    var rec = {
      id: state.editingId || uid(),
      date: date,
      awayTeam: awaySel.value,
      homeTeam: homeSel.value,
      awayPitcher: document.getElementById("f-awayPitcher").value.trim(),
      homePitcher: document.getElementById("f-homePitcher").value.trim(),
      awayScore: toNumOrNull(document.getElementById("f-awayScore").value),
      homeScore: toNumOrNull(document.getElementById("f-homeScore").value),
      awayMVP: document.getElementById("f-awayMVP").value.trim(),
      homeMVP: document.getElementById("f-homeMVP").value.trim(),
      winPitcher: document.getElementById("f-winPitcher").value.trim(),
      losePitcher: document.getElementById("f-losePitcher").value.trim(),
      savePitcher: document.getElementById("f-savePitcher").value.trim(),
      holdPitcher: document.getElementById("f-holdPitcher").value.trim(),
      stadium: stadium,
      watched: watchCb.checked,
      canceled: cancel,
      cancelReason: cancel ? cancelReason : ""
    };

    if(state.editingId){
      var idx = state.games.findIndex(function(g){ return g.id===state.editingId; });
      if(idx>-1) state.games[idx] = rec;
    } else {
      state.games.push(rec);
    }
    save();
    toast(state.editingId ? "경기 기록을 수정했습니다." : "경기 기록을 저장했습니다.");
    resetForm();
    // if calendar is showing this date's month, refresh
    renderCalendarTab();
  });

  function toNumOrNull(v){
    if(v===""||v===null||v===undefined) return null;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function loadGameIntoForm(g){
    state.editingId = g.id;
    document.getElementById("editingNotice").classList.add("show");
    document.getElementById("f-date").value = g.date;
    awaySel.value = g.awayTeam;
    homeSel.value = g.homeTeam;
    document.getElementById("f-awayPitcher").value = g.awayPitcher || "";
    document.getElementById("f-homePitcher").value = g.homePitcher || "";
    document.getElementById("f-awayScore").value = (g.awayScore===null||g.awayScore===undefined) ? "" : g.awayScore;
    document.getElementById("f-homeScore").value = (g.homeScore===null||g.homeScore===undefined) ? "" : g.homeScore;
    document.getElementById("f-awayMVP").value = g.awayMVP || "";
    document.getElementById("f-homeMVP").value = g.homeMVP || "";
    document.getElementById("f-winPitcher").value = g.winPitcher || "";
    document.getElementById("f-losePitcher").value = g.losePitcher || "";
    document.getElementById("f-savePitcher").value = g.savePitcher || "";
    document.getElementById("f-holdPitcher").value = g.holdPitcher || "";
    state.stadiumAutoOk = false;
    stadiumInput.value = g.stadium || "";
    stadiumHint.textContent = "";
    watchCb.checked = !!g.watched; watchToggle.classList.toggle("checked", watchCb.checked);
    cancelCb.checked = !!g.canceled; cancelToggle.classList.toggle("checked", cancelCb.checked);
    cancelReasonBox.classList.toggle("show", cancelCb.checked);
    document.getElementById("f-cancelReason").value = g.cancelReason || "";
    setActiveTab("input");
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function deleteGame(id){
    if(!confirm("이 경기 기록을 삭제할까요?")) return;
    state.games = state.games.filter(function(g){ return g.id!==id; });
    save();
    renderCalendarTab();
    renderOtherTab();
    renderRankingTab();
    toast("삭제했습니다.");
  }
  window.__deleteGame = deleteGame;
  window.__editGame = function(id){
    var g = state.games.find(function(x){ return x.id===id; });
    if(g) loadGameIntoForm(g);
  };

  // ---------------- Result helpers ----------------
  // returns 'win'|'loss'|'draw'|'cancel'|'sched' from perspective of `team`
  function resultFor(g, team){
    if(g.canceled) return "cancel";
    var myScore, oppScore;
    if(g.awayTeam===team){ myScore=g.awayScore; oppScore=g.homeScore; }
    else if(g.homeTeam===team){ myScore=g.homeScore; oppScore=g.awayScore; }
    else return null;
    if(myScore===null||myScore===undefined||oppScore===null||oppScore===undefined) return "sched";
    if(myScore>oppScore) return "win";
    if(myScore<oppScore) return "loss";
    return "draw";
  }

  function roundRate(n){
    // round to 3 decimal places (round at the 4th decimal digit)
    return Math.round(n*1000)/1000;
  }
  function fmtRate(n){
    if(n===null || isNaN(n)) return "-";
    var r = roundRate(n);
    return r.toFixed(3).replace(/^0\./,"0.").replace(/^-0\./,"-0.");
  }

  // ---------------- Calendar Tab ----------------
  var MONTH_NAMES_KR = function(y,m){ return y+"년 "+(m+1)+"월"; };

  document.getElementById("prevMonth").addEventListener("click", function(){
    state.calMonth--;
    if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
    state.selectedDate = null;
    renderCalendarTab();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    state.calMonth++;
    if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
    state.selectedDate = null;
    renderCalendarTab();
  });

  function gamesOnDate(dateStr, teamFilter){
    return state.games.filter(function(g){
      if(g.date!==dateStr) return false;
      if(teamFilter && g.awayTeam!==teamFilter && g.homeTeam!==teamFilter) return false;
      return true;
    });
  }

  function renderCalendarTab(){
    document.getElementById("calYM").textContent = MONTH_NAMES_KR(state.calYear, state.calMonth);
    var body = document.getElementById("calBody");
    body.innerHTML = "";

    var firstDay = new Date(state.calYear, state.calMonth, 1);
    var startWeekday = firstDay.getDay(); // 0=Sun
    var daysInMonth = new Date(state.calYear, state.calMonth+1, 0).getDate();
    var todayStr = new Date().toISOString().slice(0,10);

    var cellsHtml = [];
    for(var i=0;i<startWeekday;i++){ cellsHtml.push('<td class="empty"></td>'); }
    for(var d=1; d<=daysInMonth; d++){
      var dateStr = fmtDate(state.calYear, state.calMonth, d);
      var ncGames = gamesOnDate(dateStr, NC);
      var classes = ["day-cell"];
      if(ncGames.length) classes.push("has-game");
      if(dateStr===todayStr) classes.push("today");
      if(dateStr===state.selectedDate) classes.push("selected");
      var badges = ncGames.map(function(g){
        var r = resultFor(g, NC);
        var label = {win:"승", loss:"패", draw:"무", cancel:"취소", sched:"예정"}[r] || "";
        var watchMark = g.watched ? '<span class="watch-dot">●</span>' : "";
        return '<span class="badge '+r+'">'+label+watchMark+'</span>';
      }).join("");
      cellsHtml.push('<td class="'+classes.join(" ")+'" data-date="'+dateStr+'"><div class="day-num">'+d+'</div>'+badges+'</td>');
    }
    // pad trailing to complete weeks
    var totalCells = startWeekday + daysInMonth;
    var trailing = (7 - (totalCells % 7)) % 7;
    for(var j=0;j<trailing;j++){ cellsHtml.push('<td class="empty"></td>'); }

    // build rows
    var rowsHtml = "";
    for(var r=0;r<cellsHtml.length;r+=7){
      rowsHtml += "<tr>"+cellsHtml.slice(r,r+7).join("")+"</tr>";
    }
    body.innerHTML = rowsHtml;

    Array.prototype.forEach.call(body.querySelectorAll("td.has-game"), function(td){
      td.addEventListener("click", function(){
        state.selectedDate = td.getAttribute("data-date");
        renderCalendarTab();
      });
    });

    renderDetailPanel();
    renderStatsPanel();
  }

  function teamDisplayName(t){ return t; }

  function renderDetailPanel(){
    var panel = document.getElementById("detailPanel");
    if(!state.selectedDate){
      panel.innerHTML = '<h2 class="section-title">경기 상세</h2><div class="detail-empty">날짜를 클릭하면 그 날의 NC 경기 기록을 볼 수 있어요.</div>';
      return;
    }
    var games = gamesOnDate(state.selectedDate, NC);
    if(!games.length){
      panel.innerHTML = '<h2 class="section-title">경기 상세</h2><div class="detail-empty">해당 날짜에는 기록이 없습니다.</div>';
      return;
    }
    var html = '<h2 class="section-title">경기 상세 · '+state.selectedDate+'</h2>';
    games.forEach(function(g){
      var r = resultFor(g, NC);
      html += '<div class="detail-game">';
      html += '<div class="detail-head"><div class="detail-date">'+g.awayTeam+' @ '+g.homeTeam+'</div>';
      html += '<div>'+(g.canceled ? '<span class="cancel-tag">취소</span>' : '<span class="badge '+r+'">'+({win:"승",loss:"패",draw:"무",sched:"예정"}[r]||"")+'</span>');
      if(g.watched) html += '<span class="watch-tag">⚾ 직관</span>';
      html += '</div></div>';

      if(g.canceled){
        html += '<div class="detail-meta"><div><b>취소 사유:</b> '+escapeHtml(g.cancelReason||"-")+'</div><div><b>구장:</b> '+escapeHtml(g.stadium||"-")+'</div></div>';
      } else {
        html += '<div class="score-line">';
        html += '<div class="score-team"><div class="tname">'+escapeHtml(g.awayTeam)+'</div><div class="tscore tabular">'+(g.awayScore===null?"-":g.awayScore)+'</div></div>';
        html += '<div class="score-sep">:</div>';
        html += '<div class="score-team"><div class="tname">'+escapeHtml(g.homeTeam)+'</div><div class="tscore tabular">'+(g.homeScore===null?"-":g.homeScore)+'</div></div>';
        html += '</div>';
        html += '<div class="detail-meta">';
        html += '<div><b>구장:</b> '+escapeHtml(g.stadium||"-")+'</div>';
        html += '<div><b>선발투수:</b> '+escapeHtml(g.awayTeam)+' '+escapeHtml(g.awayPitcher||"-")+' · '+escapeHtml(g.homeTeam)+' '+escapeHtml(g.homePitcher||"-")+'</div>';
        var decisionBits = [];
        if(g.winPitcher) decisionBits.push('승 '+escapeHtml(g.winPitcher));
        if(g.losePitcher) decisionBits.push('패 '+escapeHtml(g.losePitcher));
        if(g.savePitcher) decisionBits.push('세이브 '+escapeHtml(g.savePitcher));
        if(g.holdPitcher) decisionBits.push('홀드 '+escapeHtml(g.holdPitcher));
        if(decisionBits.length){
          html += '<div><b>승패/세이브/홀드:</b> '+decisionBits.join(' · ')+'</div>';
        }
        html += '<div><b>MVP:</b> '+escapeHtml(g.awayTeam)+' '+escapeHtml(g.awayMVP||"-")+' · '+escapeHtml(g.homeTeam)+' '+escapeHtml(g.homeMVP||"-")+'</div>';
        html += '</div>';
      }
      html += '<div class="detail-actions"><button data-edit="'+g.id+'">수정</button><button data-del="'+g.id+'">삭제</button></div>';
      html += '</div>';
    });
    panel.innerHTML = html;
    Array.prototype.forEach.call(panel.querySelectorAll("[data-edit]"), function(b){
      b.addEventListener("click", function(){ window.__editGame(b.getAttribute("data-edit")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-del]"), function(b){
      b.addEventListener("click", function(){ window.__deleteGame(b.getAttribute("data-del")); });
    });
  }

  function computeRecord(games, team){
    var w=0,d=0,l=0;
    games.forEach(function(g){
      var r = resultFor(g, team);
      if(r==="win") w++;
      else if(r==="loss") l++;
      else if(r==="draw") d++;
      // cancel / sched / null -> excluded
    });
    var rate = (w+l)>0 ? w/(w+l) : null;
    return {w:w,d:d,l:l,rate:rate};
  }

  function renderStatsPanel(){
    var panel = document.getElementById("statsPanel");
    var monthGames = state.games.filter(function(g){
      if(g.awayTeam!==NC && g.homeTeam!==NC) return false;
      var dt = new Date(g.date+"T00:00:00");
      return dt.getFullYear()===state.calYear && dt.getMonth()===state.calMonth;
    });
    var yearGames = state.games.filter(function(g){
      if(g.awayTeam!==NC && g.homeTeam!==NC) return false;
      var dt = new Date(g.date+"T00:00:00");
      return dt.getFullYear()===state.calYear;
    });
    var m = computeRecord(monthGames, NC);
    var y = computeRecord(yearGames, NC);

    var html = "";
    html += '<div class="stat-block">';
    html += '<div class="label">'+(state.calMonth+1)+'월 성적</div>';
    html += '<div class="stat-record tabular">'+m.w+'승 '+m.d+'무 '+m.l+'패</div>';
    html += '<div class="stat-rate">'+(state.calMonth+1)+'월 승률 <b class="tabular">'+fmtRate(m.rate)+'</b></div>';
    html += '</div>';
    html += '<div class="stat-block">';
    html += '<div class="label">'+state.calYear+'시즌 통산</div>';
    html += '<div class="stat-record tabular">'+y.w+'승 '+y.d+'무 '+y.l+'패</div>';
    html += '<div class="stat-rate">통산 승률 <b class="tabular">'+fmtRate(y.rate)+'</b></div>';
    html += '</div>';
    panel.innerHTML = html;
  }

  // ---------------- Other Teams Tab ----------------
  function renderOtherTab(){
    var filter = otherFilter.value;
    var body = document.getElementById("otherBody");
    var rows = state.games.filter(function(g){
      return g.awayTeam!==NC && g.homeTeam!==NC;
    });
    if(filter){
      rows = rows.filter(function(g){ return g.awayTeam===filter || g.homeTeam===filter; });
    }
    rows.sort(function(a,b){ return b.date.localeCompare(a.date); });

    if(!rows.length){
      body.innerHTML = '<tr class="empty-row"><td colspan="8">기록된 경기가 없습니다.</td></tr>';
      return;
    }
    var html = "";
    rows.forEach(function(g){
      var scoreTxt = g.canceled ? "-" : ((g.awayScore===null?"-":g.awayScore) + " : " + (g.homeScore===null?"-":g.homeScore));
      var noteTxt = g.canceled ? ('<span class="cancel-tag">취소</span> '+escapeHtml(g.cancelReason||"")) : "";
      var decisionBitsO = [];
      if(g.winPitcher) decisionBitsO.push('승 '+g.winPitcher);
      if(g.losePitcher) decisionBitsO.push('패 '+g.losePitcher);
      if(g.savePitcher) decisionBitsO.push('세이브 '+g.savePitcher);
      if(g.holdPitcher) decisionBitsO.push('홀드 '+g.holdPitcher);
      var rowTitle = decisionBitsO.length ? (' title="'+escapeHtml(decisionBitsO.join(' · '))+'"') : "";
      html += "<tr"+rowTitle+">";
      html += "<td>"+g.date+"</td>";
      html += "<td>"+escapeHtml(g.awayTeam)+"</td>";
      html += '<td class="tabular">'+scoreTxt+"</td>";
      html += "<td>"+escapeHtml(g.homeTeam)+"</td>";
      html += "<td>"+escapeHtml(g.stadium||"-")+"</td>";
      html += "<td>"+(g.watched ? "⚾" : "-")+"</td>";
      html += "<td>"+noteTxt+"</td>";
      html += '<td><button class="row-btn" data-edit="'+g.id+'">수정</button><button class="row-btn" data-del="'+g.id+'">삭제</button></td>';
      html += "</tr>";
    });
    body.innerHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll("[data-edit]"), function(b){
      b.addEventListener("click", function(){ window.__editGame(b.getAttribute("data-edit")); });
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-del]"), function(b){
      b.addEventListener("click", function(){ window.__deleteGame(b.getAttribute("data-del")); });
    });
  }

  // ---------------- Ranking Tab ----------------
  function renderRankingTab(){
    var body = document.getElementById("rankBody");
    var results = TEAMS.map(function(team){
      var teamGames = state.games.filter(function(g){ return (g.awayTeam===team || g.homeTeam===team) && !g.canceled; });
      var rec = computeRecord(teamGames, team);
      var played = rec.w+rec.d+rec.l;
      return { team:team, played:played, w:rec.w, d:rec.d, l:rec.l, rate:rec.rate };
    });
    results.sort(function(a,b){
      var ar = a.rate===null ? -1 : a.rate;
      var br = b.rate===null ? -1 : b.rate;
      if(br!==ar) return br-ar;
      return b.w-a.w;
    });
    var html = "";
    results.forEach(function(row, i){
      var rankNo = i+1;
      html += '<tr class="'+(row.team===NC?"nc-row":"")+'">';
      html += '<td class="rank-no'+(rankNo===1?" top1":"")+'">'+rankNo+'</td>';
      html += "<td>"+escapeHtml(row.team)+"</td>";
      html += '<td class="tabular">'+row.played+"</td>";
      html += '<td class="tabular">'+row.w+"</td>";
      html += '<td class="tabular">'+row.d+"</td>";
      html += '<td class="tabular">'+row.l+"</td>";
      html += '<td class="rate-cell tabular">'+fmtRate(row.rate)+"</td>";
      html += "</tr>";
    });
    body.innerHTML = html;
  }

  function escapeHtml(s){
    if(s===null||s===undefined) return "";
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // init: jump calendar to most recent NC game month if exists, else current month
  (function initCalendarPosition(){
    var ncGames = state.games.filter(function(g){ return g.awayTeam===NC || g.homeTeam===NC; });
    if(ncGames.length){
      ncGames.sort(function(a,b){ return b.date.localeCompare(a.date); });
      var dt = new Date(ncGames[0].date+"T00:00:00");
      state.calYear = dt.getFullYear();
      state.calMonth = dt.getMonth();
    }
  })();

  renderCalendarTab();
  renderOtherTab();
  renderRankingTab();
})();
</script>
